<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a new password — Avcros</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../_shared/auth.css">
</head>
<body>
  <div class="auth-page">
    <header class="auth-header">
      <a href="../main/index.html" class="auth-brand">AVCROS</a>
    </header>

    <main class="auth-main">
      <div class="auth-card">
        <h1 class="auth-title">Choose a new password</h1>
        <p class="auth-subtitle">Pick something secure. At least 6 characters.</p>

        <form class="auth-form" id="resetForm" novalidate>
          <label class="auth-field">
            <span class="auth-label">New password</span>
            <div class="auth-input-with-toggle">
              <input type="password" id="password" required autocomplete="new-password" minlength="6">
              <button type="button" class="auth-password-toggle" id="passwordToggle" aria-label="Show password">
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                  <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
            <div class="auth-strength" id="strengthMeter" data-level="0">
              <div class="auth-strength-bar"></div>
              <div class="auth-strength-bar"></div>
              <div class="auth-strength-bar"></div>
            </div>
            <span class="auth-strength-label" id="strengthLabel" data-level="0"></span>
          </label>

          <button type="submit" class="auth-submit" id="submitBtn">Update password</button>
        </form>

        <div class="auth-message" id="authMessage" hidden></div>
      </div>
    </main>

    <footer class="auth-footer">
      <a href="../main/index.html">Home</a>
      <a href="../main/settings.html">Settings</a>
    </footer>
  </div>

  <script src="../_shared/supabase-config.js"></script>
  <script src="../_shared/auth.js"></script>
  <script>
    (function () {
      const form = document.getElementById('resetForm');
      const passInput = document.getElementById('password');
      const passToggle = document.getElementById('passwordToggle');
      const strengthMeter = document.getElementById('strengthMeter');
      const strengthLabel = document.getElementById('strengthLabel');
      const submitBtn = document.getElementById('submitBtn');
      const msg = document.getElementById('authMessage');

      function showMessage(text, type) {
        msg.textContent = text;
        msg.className = 'auth-message ' + (type || '');
        msg.hidden = false;
      }

      passToggle.addEventListener('click', () => {
        const isHidden = passInput.type === 'password';
        passInput.type = isHidden ? 'text' : 'password';
        passToggle.classList.toggle('showing', isHidden);
      });

      passInput.addEventListener('input', () => {
        const pw = passInput.value;
        if (!pw) {
          strengthMeter.setAttribute('data-level', '0');
          strengthLabel.setAttribute('data-level', '0');
          strengthLabel.textContent = '';
          return;
        }
        let score = 0;
        if (pw.length >= 6) score++;
        if (pw.length >= 10) score++;
        if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) score++;
        if (/[0-9]/.test(pw)) score++;
        if (/[^a-zA-Z0-9]/.test(pw)) score++;
        let level = 1, label = 'Weak';
        if (score >= 4) { level = 3; label = 'Strong'; }
        else if (score >= 2) { level = 2; label = 'Fair'; }
        strengthMeter.setAttribute('data-level', String(level));
        strengthLabel.setAttribute('data-level', String(level));
        strengthLabel.textContent = label;
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.hidden = true;

        const password = passInput.value;
        if (password.length < 6) {
          showMessage('Password must be at least 6 characters.', 'error');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Updating…';

        try {
          await AvcrosAuth.updatePassword(password);
          showMessage('Password updated. Redirecting to sign in…', 'success');
          setTimeout(() => {
            window.location.href = 'signin.html';
          }, 1200);
        } catch (err) {
          showMessage(err.message || 'Could not update password. The reset link may have expired.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Update password';
        }
      });
    })();
  </script>
</body>
</html>
